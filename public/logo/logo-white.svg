<svg fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Eiden">
  <title>Eiden logo</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#g)"/>
  <rect width="512" height="512" rx="116" fill="url(#s)"/>
  <!-- E: spine + three bars; the middle bar is shorter and lighter (a "file tab" rhythm) -->
  <rect x="142" y="128" width="64" height="256" rx="22" fill="#ffffff"/>
  <rect x="142" y="128" width="228" height="64" rx="22" fill="#ffffff"/>
  <rect x="142" y="224" width="170" height="64" rx="22" fill="#ffffff"/>
  <rect x="142" y="320" width="228" height="64" rx="22" fill="#ffffff"/>
  <circle cx="342" cy="256" r="20" fill="#ffffff"/>
</svg>
